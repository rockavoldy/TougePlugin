name: Build
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      # provenance attestation
      id-token: write
      # provenance attestation: read
      # github release: write
      contents: write
      # provenance attestation
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11
      - name: Publish (Linux x64)
        run: dotnet publish --runtime linux-x64 -c Release
      - name: Publish (Linux arm64)
        run: dotnet publish --runtime linux-arm64 -c Release
      - name: Publish (Windows x64)
        run: dotnet publish --runtime win-x64 -c Release
      - name: Verify publish payloads
        run: |
          set -euo pipefail

          expected_plugins="AutoModerationPlugin CustomCommandPlugin DiscordAuditPlugin \
          FastTravelPlugin GeoIPPlugin LiveWeatherPlugin RaceChallengePlugin RandomWeatherPlugin \
          ReportPlugin SamplePlugin TagModePlugin TimeDilationPlugin TougePlugin \
          VotingPresetPlugin VotingWeatherPlugin WordFilterPlugin"

          for rid in linux-x64 linux-arm64 win-x64; do
            case "$rid" in
              win-x64) test -f "out-$rid/AssettoServer.exe" ;;
              *)       test -f "out-$rid/AssettoServer" ;;
            esac

            test -f "out-$rid/plugins/TougePlugin/TougePlugin.dll"
            test -d "out-$rid/plugins/TougePlugin/lua"
            test -d "out-$rid/plugins/TougePlugin/wwwroot"
            test ! -f "out-$rid/plugins/TougePlugin/AssettoServer.dll"
            test ! -f "out-$rid/plugins/TougePlugin/AssettoServer.Shared.dll"
            test ! -d "out-$rid/plugins/ReplayPlugin"

            for plugin in $expected_plugins; do
              test -d "out-$rid/plugins/$plugin"
            done
          done
      - name: Package
        run: |
          set -euo pipefail

          # Server bundle (existing names, now with TougePlugin already inside plugins/)
          tar -czf "AssettoServer-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C out-linux-x64 .
          tar -czf "AssettoServer-${GITHUB_REF_NAME}-linux-arm64.tar.gz" -C out-linux-arm64 .
          (cd out-win-x64 && zip -qr "../AssettoServer-${GITHUB_REF_NAME}-win-x64.zip" .)

          # Standalone plugin (archive root is TougePlugin/)
          tar -czf "TougePlugin-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C out-linux-x64/plugins TougePlugin
          tar -czf "TougePlugin-${GITHUB_REF_NAME}-linux-arm64.tar.gz" -C out-linux-arm64/plugins TougePlugin
          (cd out-win-x64/plugins && zip -qr "../../TougePlugin-${GITHUB_REF_NAME}-win-x64.zip" TougePlugin)
      - name: Create provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            AssettoServer-${{ github.ref_name }}-linux-x64.tar.gz
            AssettoServer-${{ github.ref_name }}-linux-arm64.tar.gz
            AssettoServer-${{ github.ref_name }}-win-x64.zip
            TougePlugin-${{ github.ref_name }}-linux-x64.tar.gz
            TougePlugin-${{ github.ref_name }}-linux-arm64.tar.gz
            TougePlugin-${{ github.ref_name }}-win-x64.zip
      - name: Release (draft)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          draft: true
          files: |
            AssettoServer-${{ github.ref_name }}-linux-x64.tar.gz
            AssettoServer-${{ github.ref_name }}-linux-arm64.tar.gz
            AssettoServer-${{ github.ref_name }}-win-x64.zip
            TougePlugin-${{ github.ref_name }}-linux-x64.tar.gz
            TougePlugin-${{ github.ref_name }}-linux-arm64.tar.gz
            TougePlugin-${{ github.ref_name }}-win-x64.zip
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          prerelease: true
          files: |
            AssettoServer-${{ github.ref_name }}-linux-x64.tar.gz
            AssettoServer-${{ github.ref_name }}-linux-arm64.tar.gz
            AssettoServer-${{ github.ref_name }}-win-x64.zip
            TougePlugin-${{ github.ref_name }}-linux-x64.tar.gz
            TougePlugin-${{ github.ref_name }}-linux-arm64.tar.gz
            TougePlugin-${{ github.ref_name }}-win-x64.zip
